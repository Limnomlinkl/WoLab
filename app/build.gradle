plugins {
    id 'com.android.application'
    id 'com.google.dagger.hilt.android'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.example.wol'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.wol"
        minSdk 32
        targetSdk 36
        versionCode 3
        versionName "0.3b"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Экспорт схемы Room: нужен, чтобы будущие обновления БД
        // сопровождались явными миграциями и не теряли данные.
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storeType keystoreProperties.getProperty('storeType', 'JKS')
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Один и тот же ключ подписи для всех релизов — обязательное условие
            // установки обновлений поверх предыдущей версии без потери данных.
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.activity:activity:1.12.0'
    implementation 'androidx.fragment:fragment:1.8.9'

    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.9.0'

    implementation 'androidx.navigation:navigation-fragment:2.10.1'
    implementation 'androidx.navigation:navigation-ui:2.10.1'

    implementation 'androidx.room:room-runtime:2.7.2'
    annotationProcessor 'androidx.room:room-compiler:2.7.2'

    implementation 'com.google.dagger:hilt-android:2.57.1'
    annotationProcessor 'com.google.dagger:hilt-android-compiler:2.57.1'
}
